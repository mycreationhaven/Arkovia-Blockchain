name: Hubzam Connected Signer

on:
  push:
    branches:
      - feature/hubzam-connected-message-signing
      - feature/arkovia-signer-pwa
      - main
    paths:
      - 'html/www/js/nrs.modals.token.js'
      - 'html/www/html/modals/nrs.html'
      - 'html/www/html/header.html'
      - 'scripts/validate-hubzam-connected-signer.mjs'
      - 'html/www/signer/**'
      - 'scripts/validate-arkovia-signer-pwa.mjs'
      - '.github/workflows/hubzam-connected-signer.yml'
      - 'html/www/signer/**'
      - 'scripts/validate-arkovia-signer-pwa.mjs'
  pull_request:
    paths:
      - 'html/www/js/nrs.modals.token.js'
      - 'html/www/html/modals/nrs.html'
      - 'html/www/html/header.html'
      - 'scripts/validate-hubzam-connected-signer.mjs'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check signer
        run: node --check html/www/js/nrs.modals.token.js
      - name: Validate connected signer boundaries
        run: node scripts/validate-hubzam-connected-signer.mjs
      - name: Syntax check signer PWA
        run: |
          node --check html/www/signer/app.js
          node --check html/www/signer/crypto.js
          node --check html/www/signer/vault.js
          node --check html/www/signer/sw.js
      - name: Validate signer PWA security and offline boundaries
        run: node scripts/validate-arkovia-signer-pwa.mjs
